name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install golang
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.5
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Get GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_FETCH_GITHUB_APP_ID }}
          private-key: ${{ secrets.CI_FETCH_GITHUB_APP_PRIVATE_KEY }}
          owner: herdworks

      - name: Configure git to use the App token for GitHub
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com".insteadOf "https://github.com"

      - name: Lint
        run: |
          set -e
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -e
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" -F CHANGELOG.md
          gh release upload "${{ github.ref_name }}" builds/release/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
