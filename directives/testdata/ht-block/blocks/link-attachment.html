<link-attachment>
    <a href='${ block.href, page.attachments.1.data.hypergraph.href }' target='_blank' ht-apply ht-debug='element,data'>
        <img src='${ block.cover, page.attachments.1.data.hypergraph.cover }' ht-apply loading='lazy' class='cover'>
        <img src='${ block.favicon, page.attachments.1.data.hypergraph.favicon }' ht-apply loading='lazy' class='favicon'>
        <span ht-apply>${ block.title, page.attachments.1.data.hypergraph.title }</span>
        <p ht-apply>${ block.description, page.attachments.1.data.hypergraph.description }</p>
    </a>
</link-attachment>
