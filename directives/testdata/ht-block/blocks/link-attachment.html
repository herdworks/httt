<link-attachment>
    <a href='' target='_blank' ht-attrs='href:block.href,page.attachments.1.data.hypergraph.href' ht-debug='element,data'>
        <img ht-attrs='src:block.cover,page.attachments.1.data.hypergraph.cover' loading='lazy' class='cover'>
        <img ht-attrs='src:block.favicon,page.attachments.1.data.hypergraph.favicon' loading='lazy' class='favicon'>
        <span ht-apply>${ block.title, page.attachments.1.data.hypergraph.title }</span>
        <p ht-apply>${ block.description, page.attachments.1.data.hypergraph.description }</p>
    </a>
</link-attachment>
